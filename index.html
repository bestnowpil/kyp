<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#155e4b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="주유 정산">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>주유·작업 월별 정산</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#172b25;background:#f3f7f4;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{background:#155e4b;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 17px}header h1{font-size:21px;margin:0 0 4px}header p{margin:0;font-size:12px;opacity:.9}.wrap{max-width:720px;margin:auto;padding:13px 13px calc(20px + env(safe-area-inset-bottom))}.card{background:#fff;border:1px solid #e1eae4;border-radius:16px;padding:15px;margin-bottom:13px;box-shadow:0 2px 8px #18382b0a}h2{font-size:17px;margin:0 0 13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:13px;color:#52645c;margin:0 0 5px}input,button,textarea{font:inherit}input,textarea{width:100%;min-width:0;border:1px solid #d4dfd8;border-radius:10px;padding:10px;background:#fff;color:#172b25;font-size:16px}input{min-height:46px}textarea{resize:vertical;line-height:1.55}input[type=number]{appearance:textfield}button{min-height:44px;border:0;border-radius:10px;padding:10px 13px;font-weight:650;cursor:pointer}.primary{background:#155e4b;color:#fff;width:100%;margin-top:11px}.secondary{background:#e9f2ed;color:#155e4b}.danger{background:#fff0ee;color:#a53226}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.stat{background:#f2f7f3;padding:11px;border-radius:12px}.stat small{display:block;color:#607168;font-size:12px}.stat strong{font-size:17px;display:block;margin-top:3px;overflow-wrap:anywhere}.muted,.status{font-size:12px;color:#66776e;line-height:1.55}.status{min-height:18px;margin-top:7px}.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:11px 0;border-top:1px solid #edf1ee}.entry strong{font-size:14px}.entry .muted{margin-top:3px}.memo-preview{margin-top:5px;color:#52645c;font-size:12px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.memo-launch{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;margin-top:11px;background:#f2f7f3;color:#155e4b}.memo-launch small{font-weight:400;color:#66776e}.memo-toolbar{display:flex;gap:8px;margin:10px 0}.memo-toolbar button{min-height:40px;background:#e9f2ed;color:#155e4b;padding:8px 12px}.memo-editor{min-height:42vh;max-height:58vh;line-height:1.65}.note-item{padding:12px 0;border-top:1px solid #edf1ee}.note-item:first-child{border-top:0}.note-item-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.note-item-title{font-size:14px;font-weight:700}.note-item-body{margin-top:5px;color:#52645c;font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.note-item-actions{display:flex;gap:6px}.note-item-actions button{min-height:38px;padding:7px 9px}.actions{display:flex;flex-wrap:wrap;gap:8px}.records-toggle{background:#e9f2ed;color:#155e4b}.modal-backdrop{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:16px;background:#10251fb8}.modal-backdrop.open{display:flex}.modal-card{width:min(100%,560px);max-height:91dvh;overflow:auto;background:#fff;border-radius:18px;padding:18px;box-shadow:0 18px 55px #0004}.modal-title{margin:0;font-size:18px}.close{background:#eef3ef;color:#43574c;padding:5px 11px;font-size:21px}.modal-actions{display:flex;gap:9px;margin-top:13px}.modal-actions button{flex:1}.cancel{background:#e9f2ed;color:#155e4b}.hidden{display:none!important}.calc-result{background:#f2f7f3;border-radius:12px;padding:13px;margin-top:12px;line-height:1.6}.calc-result strong{font-size:19px;color:#155e4b}.backup-note{margin:10px 0 0}@media(max-width:600px){header{padding:calc(15px + env(safe-area-inset-top)) 15px 14px}.wrap{padding:11px 11px calc(18px + env(safe-area-inset-bottom))}.card{padding:14px;border-radius:14px}.modal-backdrop{align-items:flex-end;padding:0}.modal-card{width:100%;max-height:89dvh;border-radius:20px 20px 0 0;padding:19px 15px calc(16px + env(safe-area-inset-bottom))}.modal-actions{position:sticky;bottom:0;background:#fff;padding-top:8px}.entry{grid-template-columns:minmax(0,1fr) auto}.entry-buttons{display:flex;gap:5px}.entry-buttons button{padding:7px 9px;min-height:40px}}
    .memo-main-button{background:#155e4b;color:#fff;font-size:16px;min-height:50px;box-shadow:0 2px 6px #155e4b33}
  </style>
</head>
<body>
  <header><h1>주유·작업 월별 정산</h1><p>기록은 이 휴대폰에 저장됩니다. 인터넷 없이 사용할 수 있어요.</p></header>
  <main class="wrap">
    <section class="card">
      <div class="row"><h2 style="margin:0">월별 정산</h2><input id="month" type="month" style="width:auto"></div>
      <div id="summary" class="stats"></div>
      <div class="grid" style="margin-top:11px"><button id="openEntry" class="primary" style="margin:0">기록 입력</button><button id="openCalc" class="secondary">연비 계산</button></div>
      <button id="openStandaloneMemo" class="memo-main-button" style="width:100%;margin-top:10px">메모 입력</button>
      <div id="status" class="status" aria-live="polite"></div>
    </section>
    <section class="card"><div class="row"><button id="toggleRecords" class="records-toggle" aria-expanded="false">해당 월 기록 보기</button><span id="count" class="muted"></span></div><div id="records" class="hidden" style="margin-top:8px"></div></section>
    <section class="card"><div class="row"><h2 style="margin:0">메모</h2><span id="noteCount" class="muted"></span></div><div id="notes" style="margin-top:8px"></div></section>
    <section class="card"><h2>기록 백업과 복원</h2><p class="muted">주유 기록과 메모를 함께 백업합니다. 휴대폰을 바꾸거나 기록을 옮길 때 파일을 저장한 뒤 다른 기기에서 불러오세요.</p><div class="actions"><button id="backup" class="secondary">백업 파일 저장</button><button id="pick" class="secondary">백업 불러오기</button><input id="file" class="hidden" type="file" accept="application/json,.json"></div><p class="muted backup-note">앱이나 브라우저 데이터를 지우기 전에 백업해 주세요. 기기끼리 자동 동기화되지는 않습니다.</p></section>
  </main>

  <div id="entryModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="entryTitle"><div class="modal-card"><div class="row" style="margin-bottom:13px"><h2 id="entryTitle" class="modal-title">기록 입력</h2><button class="close" data-close="entryModal" aria-label="닫기">×</button></div><div class="grid"><div><label for="fuel">주유량 (리터)</label><input id="fuel" type="number" min="0" step="0.01" inputmode="decimal" placeholder="예: 45.5"></div><div><label for="date">날짜</label><input id="date" type="date"></div><div><label for="km">총 Km</label><input id="km" type="number" min="0" step="1" inputmode="decimal" placeholder="0"></div><div><label for="cycles">회전수</label><input id="cycles" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></div><div><label for="waste">폐수 횟수</label><input id="waste" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></div><div><label for="wait">대기 횟수</label><input id="wait" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></div><div><label for="other">기타 횟수</label><input id="other" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></div></div><div class="modal-actions"><button class="cancel" data-close="entryModal">취소</button><button id="saveEntry" class="primary" style="margin:0">저장하기</button></div><div id="entryStatus" class="status" aria-live="polite"></div></div></div>

  <div id="editModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="editTitle"><div class="modal-card"><div class="row" style="margin-bottom:13px"><h2 id="editTitle" class="modal-title">기록 수정</h2><button class="close" data-close="editModal" aria-label="닫기">×</button></div><div class="grid"><div><label for="editFuel">주유량 (리터)</label><input id="editFuel" type="number" min="0" step="0.01" inputmode="decimal"></div><div><label for="editDate">날짜</label><input id="editDate" type="date"></div><div><label for="editKm">총 Km</label><input id="editKm" type="number" min="0" step="1" inputmode="decimal"></div><div><label for="editCycles">회전수</label><input id="editCycles" type="number" min="0" step="1"></div><div><label for="editWaste">폐수 횟수</label><input id="editWaste" type="number" min="0" step="1"></div><div><label for="editWait">대기 횟수</label><input id="editWait" type="number" min="0" step="1"></div><div><label for="editOther">기타 횟수</label><input id="editOther" type="number" min="0" step="1"></div></div><div class="modal-actions"><button class="cancel" data-close="editModal">취소</button><button id="saveEdit" class="primary" style="margin:0">저장하기</button></div><div id="editStatus" class="status" aria-live="polite"></div></div></div>

  <div id="standaloneNoteModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="standaloneNoteHeading"><div class="modal-card"><div class="row" style="margin-bottom:13px"><h2 id="standaloneNoteHeading" class="modal-title">메모 입력</h2><button class="close" data-close="standaloneNoteModal" aria-label="닫기">×</button></div><label for="standaloneNoteDate">날짜</label><input id="standaloneNoteDate" type="date"><label for="standaloneNoteTitle" style="margin-top:12px">제목</label><input id="standaloneNoteTitle" maxlength="80" placeholder="메모 제목"><div class="memo-toolbar"><button id="noteInsertBullet" type="button">• 목록</button><button id="noteInsertCheck" type="button">□ 체크 항목</button></div><label for="standaloneNoteBody">내용</label><textarea id="standaloneNoteBody" class="memo-editor" placeholder="메모를 입력하세요. 여러 줄로 작성할 수 있습니다."></textarea><div id="standaloneNoteCount" class="muted" style="text-align:right;margin-top:5px">0자</div><div id="standaloneNoteStatus" class="status" aria-live="polite"></div><div class="modal-actions"><button class="cancel" data-close="standaloneNoteModal">취소</button><button id="saveStandaloneNote" class="primary" style="margin:0">저장하기</button></div></div></div>

  <div id="calcModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="calcTitle"><div class="modal-card"><div class="row" style="margin-bottom:13px"><h2 id="calcTitle" class="modal-title">연비 계산</h2><button class="close" data-close="calcModal" aria-label="닫기">×</button></div><p class="muted">선택한 월의 총 Km와 주유량을 먼저 불러옵니다. 계산값은 기록에 저장되지 않습니다.</p><div class="grid"><div><label for="calcKm">총 Km</label><input id="calcKm" type="number" min="0" step="1" inputmode="decimal"></div><div><label for="calcFuel">주유량 (리터)</label><input id="calcFuel" type="number" min="0" step="0.01" inputmode="decimal"></div><div><label for="standardRate">기준 연비 (L/Km)</label><input id="standardRate" type="number" min="0.01" step="0.01" value="0.58" inputmode="decimal"></div><div><label for="fuelPrice">기름값 (원/L)</label><input id="fuelPrice" type="number" min="0" step="1" value="1689" inputmode="numeric"></div></div><button id="calculate" class="primary">계산하기</button><div id="calcResult" class="calc-result hidden" aria-live="polite"></div><div class="modal-actions"><button class="cancel" data-close="calcModal">닫기</button></div></div></div>

  <script>
    (()=>{
      'use strict';
      const DB_NAME='fuel-work-offline-v2', STORE='records', NOTE_STORE='notes';
      const $=id=>document.getElementById(id);
      const now=new Date(), today=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);
      $('month').value=today.slice(0,7);$('date').value=today;
      let db, records=[], notes=[], editingId=null, standaloneNoteId=null, recordsOpen=false;
      const openDB=()=>new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,2);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE)){const s=d.createObjectStore(STORE,{keyPath:'id'});s.createIndex('date','date')}if(!d.objectStoreNames.contains(NOTE_STORE))d.createObjectStore(NOTE_STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
      const allRecords=()=>new Promise((resolve,reject)=>{const req=db.transaction(STORE,'readonly').objectStore(STORE).getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)});
      const writeRecord=x=>new Promise((resolve,reject)=>{const req=db.transaction(STORE,'readwrite').objectStore(STORE).put(x);req.onsuccess=()=>resolve();req.onerror=()=>reject(req.error)});
      const removeRecordFromDB=id=>new Promise((resolve,reject)=>{const req=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);req.onsuccess=()=>resolve();req.onerror=()=>reject(req.error)});
      const allNotes=()=>new Promise((resolve,reject)=>{const req=db.transaction(NOTE_STORE,'readonly').objectStore(NOTE_STORE).getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)});
      const writeNote=x=>new Promise((resolve,reject)=>{const req=db.transaction(NOTE_STORE,'readwrite').objectStore(NOTE_STORE).put(x);req.onsuccess=()=>resolve();req.onerror=()=>reject(req.error)});
      const removeNoteFromDB=id=>new Promise((resolve,reject)=>{const req=db.transaction(NOTE_STORE,'readwrite').objectStore(NOTE_STORE).delete(id);req.onsuccess=()=>resolve();req.onerror=()=>reject(req.error)});
      const fmt=(n,d=0)=>Number(n||0).toLocaleString('ko-KR',{maximumFractionDigits:d});
      const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const dateFromValue=value=>{const s=String(value||'');if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const d=new Date(value||Date.now());return Number.isNaN(d.getTime())?today:new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
      const dateLabel=value=>new Date(dateFromValue(value)+'T00:00:00').toLocaleDateString('ko-KR');
      function status(s){$('status').textContent=s}
      const newId=()=>crypto.randomUUID?.()||String(Date.now())+Math.random().toString(16).slice(2);
      async function refresh(){[records,notes]=await Promise.all([allRecords(),allNotes()]);render()}
      function render(){const m=$('month').value,rows=records.filter(x=>(x.date||'').startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date));const sum=k=>rows.reduce((a,x)=>a+(Number(x[k])||0),0);$('summary').innerHTML=[['주유량',fmt(sum('fuel'),2)+' L'],['총 Km',fmt(sum('km'))+' Km'],['회전수',fmt(sum('cycles'))+' 회'],['폐수',fmt(sum('waste'))+' 회'],['대기',fmt(sum('wait'))+' 회'],['기타',fmt(sum('other'))+' 회'],['기록',rows.length+' 건']].map(([a,b])=>`<div class="stat"><small>${a}</small><strong>${b}</strong></div>`).join('');$('count').textContent=rows.length+'건';$('records').innerHTML=rows.length?rows.map(x=>{const memo=[x.memoTitle,x.memo].filter(Boolean).join('\n');return `<div class="entry"><div><strong>${esc(x.date)}</strong><div class="muted">주유 ${fmt(x.fuel,2)} L · 총 ${fmt(x.km)} Km · 회전 ${fmt(x.cycles)} · 폐수 ${fmt(x.waste)} · 대기 ${fmt(x.wait)} · 기타 ${fmt(x.other)}</div>${memo?`<div class="memo-preview">${esc(memo.slice(0,180))}${memo.length>180?'…':''}</div>`:''}</div><div class="entry-buttons"><button class="secondary" data-edit="${esc(x.id)}">수정</button> <button class="danger" data-delete="${esc(x.id)}">삭제</button></div></div>`}).join(''):'<p class="muted">이 달에는 기록이 없습니다.</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editRecord(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteRecord(b.dataset.delete));renderNotes()}
      function renderNotes(){const sorted=[...notes].sort((a,b)=>String(b.date||dateFromValue(b.createdAt)).localeCompare(String(a.date||dateFromValue(a.createdAt)))||String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));$('noteCount').textContent=sorted.length+'개';$('notes').innerHTML=sorted.length?sorted.map(n=>{const body=String(n.body||'');const date=n.date||dateFromValue(n.createdAt);return `<article class="note-item"><div class="note-item-header"><div><div class="note-item-title">${esc(n.title||'제목 없는 메모')}</div><div class="muted">${esc(dateLabel(date))}</div></div><div class="note-item-actions"><button class="secondary" data-note-edit="${esc(n.id)}">수정</button><button class="danger" data-note-delete="${esc(n.id)}">삭제</button></div></div>${body?`<div class="note-item-body">${esc(body.length>260?body.slice(0,260)+'…':body)}</div>`:''}</article>`}).join(''):'<p class="muted">저장된 메모가 없습니다. 위의 ‘메모 입력’을 눌러 작성해 보세요.</p>';document.querySelectorAll('[data-note-edit]').forEach(b=>b.onclick=()=>openStandaloneNote(b.dataset.noteEdit));document.querySelectorAll('[data-note-delete]').forEach(b=>b.onclick=()=>deleteStandaloneNote(b.dataset.noteDelete))}
      function openModal(id){$(id).classList.add('open')}
      function closeModal(id){$(id).classList.remove('open')}
      document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));document.querySelectorAll('.modal-backdrop').forEach(m=>m.onclick=e=>{if(e.target===m)closeModal(m.id)});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-backdrop.open').forEach(m=>closeModal(m.id))});
      function updateStandaloneNoteCount(){$('standaloneNoteCount').textContent=$('standaloneNoteBody').value.length.toLocaleString('ko-KR')+'자'}
      function openStandaloneNote(id=null){const note=id?notes.find(n=>n.id===id):null;standaloneNoteId=note?.id||null;$('standaloneNoteHeading').textContent=note?'메모 수정':'메모 입력';$('standaloneNoteDate').value=note?(note.date||dateFromValue(note.createdAt)):today;$('standaloneNoteTitle').value=note?.title||'';$('standaloneNoteBody').value=note?.body||'';$('standaloneNoteStatus').textContent='';updateStandaloneNoteCount();openModal('standaloneNoteModal');$('standaloneNoteDate').focus()}
      $('openStandaloneMemo').onclick=()=>openStandaloneNote();$('standaloneNoteBody').oninput=updateStandaloneNoteCount;
      function insertNoteToken(token){const area=$('standaloneNoteBody'),start=area.selectionStart,end=area.selectionEnd;area.setRangeText(token,start,end,'end');area.focus();updateStandaloneNoteCount()}
      $('noteInsertBullet').onclick=()=>insertNoteToken('• ');$('noteInsertCheck').onclick=()=>insertNoteToken('□ ');
      $('saveStandaloneNote').onclick=async()=>{const date=$('standaloneNoteDate').value||today,title=$('standaloneNoteTitle').value.trim(),body=$('standaloneNoteBody').value;if(!title&&!body.trim()){$('standaloneNoteStatus').textContent='제목이나 내용을 입력해 주세요.';return}const previous=notes.find(n=>n.id===standaloneNoteId),stamp=new Date().toISOString();try{await writeNote({id:standaloneNoteId||newId(),date,title,body,createdAt:previous?.createdAt||stamp,updatedAt:stamp});standaloneNoteId=null;await refresh();closeModal('standaloneNoteModal');status('메모를 이 휴대폰에 저장했습니다.')}catch(e){$('standaloneNoteStatus').textContent='메모를 저장하지 못했습니다. 저장 공간을 확인해 주세요.'}};
      async function deleteStandaloneNote(id){if(!confirm('이 메모를 삭제할까요?'))return;await removeNoteFromDB(id);await refresh();status('메모를 삭제했습니다.')}
      $('openEntry').onclick=()=>{$('date').value=today;['fuel','km','cycles','waste','wait','other'].forEach(k=>$(k).value='');$('entryStatus').textContent='';openModal('entryModal');$('fuel').focus()};
      $('saveEntry').onclick=async()=>{const r=readRecord('');const error=validate(r);if(error){$('entryStatus').textContent=error;return}try{await writeRecord(r);await refresh();$('month').value=r.date.slice(0,7);render();closeModal('entryModal');status('이 휴대폰에 저장했습니다.')}catch(e){$('entryStatus').textContent='저장하지 못했습니다. 저장 공간을 확인해 주세요.'}};
      function readRecord(prefix){const key=k=>$(prefix?prefix+k[0].toUpperCase()+k.slice(1):k).value;const previous=prefix?records.find(r=>r.id===editingId):null;const result={id:editingId||crypto.randomUUID?.()||String(Date.now()),date:key('date'),fuel:key('fuel'),km:key('km'),cycles:key('cycles'),waste:key('waste'),wait:key('wait'),other:key('other')};if(previous){result.memoTitle=previous.memoTitle||'';result.memo=previous.memo||''}return result}
      function validate(r){if(!r.date)return'날짜를 입력해 주세요.';const nums=['fuel','km','cycles','waste','wait','other'].map(k=>r[k]===''?0:Number(r[k]));if(nums.some(n=>!Number.isFinite(n)||n<0))return'0 이상의 숫자를 입력해 주세요.';if(nums.every(n=>n===0)&&!(r.memoTitle||'').trim()&&!(r.memo||'').trim())return'주유량, Km 또는 횟수 중 하나 이상 입력해 주세요.';return''}
      function editRecord(id){const x=records.find(r=>r.id===id);if(!x)return;editingId=id;$('editDate').value=x.date;['fuel','km','cycles','waste','wait','other'].forEach(k=>$('edit'+k[0].toUpperCase()+k.slice(1)).value=x[k]??0);$('editStatus').textContent='';openModal('editModal');$('editFuel').focus()}
      $('saveEdit').onclick=async()=>{const r=readRecord('edit');r.id=editingId;const error=validate(r);if(error){$('editStatus').textContent=error;return}try{await writeRecord(r);editingId=null;await refresh();$('month').value=r.date.slice(0,7);render();closeModal('editModal');status('수정 내용을 저장했습니다.')}catch(e){$('editStatus').textContent='수정 내용을 저장하지 못했습니다.'}};
      async function deleteRecord(id){if(!confirm('이 기록을 삭제할까요?'))return;await removeRecordFromDB(id);await refresh();status('기록을 삭제했습니다.')}
      $('month').onchange=render;$('toggleRecords').onclick=()=>{recordsOpen=!recordsOpen;$('records').classList.toggle('hidden',!recordsOpen);$('toggleRecords').textContent=recordsOpen?'해당 월 기록 숨기기':'해당 월 기록 보기';$('toggleRecords').setAttribute('aria-expanded',String(recordsOpen))};
      $('openCalc').onclick=()=>{const m=$('month').value,rows=records.filter(x=>(x.date||'').startsWith(m));$('calcKm').value=rows.reduce((a,x)=>a+(Number(x.km)||0),0)||'';$('calcFuel').value=rows.reduce((a,x)=>a+(Number(x.fuel)||0),0)||'';$('calcResult').classList.add('hidden');openModal('calcModal')};
      $('calculate').onclick=()=>{const km=Number($('calcKm').value),fuel=Number($('calcFuel').value),rate=Number($('standardRate').value),price=Number($('fuelPrice').value);if(!(km>0)||fuel<0||!(rate>0)||price<0){$('calcResult').innerHTML='총 Km, 주유량, 기준 연비와 기름값을 확인해 주세요.';$('calcResult').classList.remove('hidden');return}const actualRate=Math.floor((fuel/km)*100)/100,standardLiters=km*rate,savedLiters=Math.max(0,standardLiters-fuel),benefit=Math.floor(savedLiters*price/100)*100;$('calcResult').innerHTML=`실제 연비: <b>${fmt(actualRate,2)} L/Km</b><br>기준 연료량: ${fmt(standardLiters,2)} L<br>기준보다 절약한 연료: ${fmt(savedLiters,2)} L<br><strong>계산 금액: ${fmt(benefit)}원</strong>${actualRate<rate?'':'<br><span class="muted">기준보다 주유량이 많아 계산 금액은 0원입니다.</span>'}`;$('calcResult').classList.remove('hidden')};
      $('backup').onclick=async()=>{const payload={format:'fuel-work-backup-v4',exportedAt:new Date().toISOString(),records:await allRecords(),notes:await allNotes()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='주유작업기록_백업_'+today+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
      $('pick').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const parsed=JSON.parse(await f.text()),incomingRecords=Array.isArray(parsed)?parsed:parsed.records,incomingNotes=Array.isArray(parsed)?[]:parsed.notes||[];if(!Array.isArray(incomingRecords)||!Array.isArray(incomingNotes)||incomingRecords.some(x=>!x||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(x.date||''))||incomingNotes.some(x=>!x||typeof x!=='object'))throw Error('bad');if(confirm(`백업 기록 ${incomingRecords.length}건과 메모 ${incomingNotes.length}개를 현재 기기에 합칠까요? 같은 항목이 중복될 수 있습니다.`)){const recordIds=new Set((await allRecords()).map(x=>x.id)),noteIds=new Set((await allNotes()).map(x=>x.id));for(const x of incomingRecords){const id=x.id&&!recordIds.has(x.id)?x.id:newId();recordIds.add(id);await writeRecord({...x,id,fuel:Number(x.fuel)||0,km:Number(x.km)||0,cycles:Number(x.cycles)||0,waste:Number(x.waste)||0,wait:Number(x.wait)||0,other:Number(x.other)||0,memoTitle:String(x.memoTitle||''),memo:String(x.memo||'')})}for(const n of incomingNotes){const id=n.id&&!noteIds.has(n.id)?n.id:newId();noteIds.add(id);const stamp=new Date().toISOString();await writeNote({id,date:String(n.date||dateFromValue(n.createdAt||stamp)),title:String(n.title||''),body:String(n.body||''),createdAt:n.createdAt||stamp,updatedAt:n.updatedAt||stamp})}await refresh();status('백업 기록과 메모를 불러왔습니다.')}}catch(err){alert('올바른 주유 기록 백업 파일이 아닙니다.')}e.target.value=''};
      if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>status('오프라인 저장 기능을 시작하지 못했습니다. 인터넷 연결을 확인해 주세요.')));
      openDB().then(async d=>{db=d;await refresh()}).catch(()=>status('이 브라우저에서 로컬 저장을 시작하지 못했습니다. Safari 또는 Chrome 최신 버전으로 열어 주세요.'));
    })();
  </script>
